name: CI and database deploy

# Pull requests and pushes to main run every check. A push to main that changes
# supabase/migrations/ then applies the new migrations to the hosted Supabase project, but only
# after all checks pass. The frontend is deployed separately by Vercel's GitHub integration.
#
# What this does NOT do: it never pushes supabase/config.toml settings (hook, sign-ups, password
# length, redirect URLs). config.toml describes the local stack; apply auth settings in the
# dashboard. See docs/Auth_and_Roles.md.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a run on main part-way through a deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SUPABASE_CLI_VERSION: 3.0.0

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lockfile must use the public npm registry
        working-directory: .
        run: |
          if grep -q codeartifact frontend/package-lock.json; then
            echo "frontend/package-lock.json references a private registry. Regenerate it with --registry=https://registry.npmjs.org/" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build
      - name: No run data may ship in the build
        run: test ! -e dist/data/latest.json

  backend:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests

  database:
    name: Database (migrations and pgTAP tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      # Starting the local stack applies every migration from scratch, so a broken migration fails here.
      - name: Start local Supabase stack
        run: supabase start
      - name: Run database tests
        run: supabase test db
      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  deploy-database:
    name: Deploy migrations to Supabase
    needs: [frontend, backend, database]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Create a "production" environment in the repo settings to require a reviewer before this job runs.
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did migrations change?
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run: checking for pending migrations."
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "Cannot compare with the previous commit: checking for pending migrations."
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- supabase/migrations; then
            echo "No migration changes in this push. Nothing to deploy."
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          else
            echo "Migration files changed."
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check deploy secrets
        if: steps.changed.outputs.migrations == 'true'
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        if: steps.changed.outputs.migrations == 'true'
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the hosted project
        if: steps.changed.outputs.migrations == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      # --skip-vault: do not touch vault secrets from config.toml.
      - name: Show pending migrations
        if: steps.changed.outputs.migrations == 'true'
        run: supabase db push --remote --skip-vault --dry-run
      - name: Apply migrations
        if: steps.changed.outputs.migrations == 'true'
        run: supabase db push --remote --skip-vault --yes
